<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Comparação — Selo Contemporâneo</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: #111512; color: #f0e9db; font: 600 15px Inter, sans-serif; }
      h1 { margin: 0 0 24px; font: 600 30px Georgia, serif; }
      .grid { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 20px; align-items: start; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; color: #c9a15a; letter-spacing: .08em; text-transform: uppercase; }
      img { display: block; width: 100%; height: auto; border: 1px solid #554225; border-radius: 16px; }
    </style>
  </head>
  <body>
    <h1>Selo Contemporâneo — referência e implementação</h1>
    <div class="grid">
      <figure>
        <figcaption>Referência selecionada</figcaption>
        <img src="referencia-selo-contemporaneo.png" alt="" />
      </figure>
      <figure>
        <figcaption>Implementação — claro</figcaption>
        <img src="login-light.png" alt="" />
      </figure>
      <figure>
        <figcaption>Implementação — escuro</figcaption>
        <img src="login-dark.png" alt="" />
      </figure>
      <figure>
        <figcaption>Tesouro — autenticado</figcaption>
        <img src="autenticado/tesouro-dark.png" alt="" />
      </figure>
      <figure>
        <figcaption>EBD — autenticado</figcaption>
        <img src="autenticado/ebd-dark.png" alt="" />
      </figure>
    </div>
  </body>
</html>
